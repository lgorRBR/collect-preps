name: Aviso para a equipa

on:
  workflow_dispatch:
    inputs:
      mensagem:
        description: "Mensagem a enviar para todos"
        type: string
        required: true

permissions:
  contents: read

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund --prefix .github/notify firebase-admin@13
      - run: node .github/notify/aviso.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MENSAGEM: ${{ inputs.mensagem }}
