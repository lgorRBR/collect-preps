<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18181A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collect Preps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>COLLECT LX FACTORY F&amp;B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: brand red masthead with the white collect seal, then a single column of solid action tiles and prep cards; Arial like the house documents, mono for quantities. */
:root{
  --brand:#E8174A; --brand-ink:#FFFFFF; --brand-deep:#C8103E; --accent:#FF5C85; --pink:#2E1C22;
  --bg:#18181A; --surface:#222225; --ink:#F2EEEA; --dark:#0F0F10; --muted:#A9A3A5; --line:#333336;
  --warn:#FFB54D; --warn-soft:#3A2A10; --ok:#55C78F; --ok-soft:#143022; --input:#2A2A2E;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --display:"Bricolage Grotesque",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* masthead */
.mast{background:var(--bg);color:var(--ink);padding:18px 16px 0}
.stripe{height:6px;margin-top:14px;background:repeating-linear-gradient(135deg,#E8174A 0 10px,#18181A 10px 20px)}
.mast .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:14px}
.seal{width:58px;height:58px;border-radius:50%;background:#FFFFFF;color:#E8174A;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.seal b{font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1}
.seal span{font-weight:700;font-size:5.6px;letter-spacing:.14em;margin-top:2px}
.mt{min-width:0;flex:1}
.mt h1{margin:0;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.mt p{margin:3px 0 0;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;font-size:12px;max-width:40%}
.who img{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 110px;display:flex;flex-direction:column;gap:16px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:13px;align-self:flex-start}
.back svg{width:16px;height:16px}

/* status strip */
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}
.stat span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.crit b{color:var(--accent)} .stat.warn b{color:var(--warn)}
.last{font-size:13px;color:var(--muted);margin:-4px 0 0}

/* action tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border-radius:18px;padding:18px 16px;border:0;min-height:132px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.tile svg{width:28px;height:28px}
.tile b{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.tile small{font-size:12px;opacity:.85;line-height:1.3}
.tile .cnt{position:absolute;top:14px;right:14px;font-family:var(--mono);font-weight:600;font-size:13px;border-radius:999px;padding:3px 10px}
.t-count{background:var(--dark);color:#FFFFFF}
.t-list{background:var(--brand);color:#FFFFFF}
.t-list .cnt{background:#FFFFFF;color:#E8174A}
.t-rec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.t-party{background:var(--pink);color:var(--ink)}
.t-mins{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;background:var(--surface);border:1.5px dashed var(--brand);color:var(--ink)}
.t-mins .lock{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tile:active{transform:translateY(1px)}
.wide{grid-column:1/-1}

/* home (G) */
.hring{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px}
.hring svg{flex:none}
.hring h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.02em}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip2{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px}
.chip2.c{background:var(--brand-deep);color:#FFFFFF}.chip2.w{background:var(--warn);color:#18181A}.chip2.o{background:var(--ok-soft);color:var(--ok)}
.next{display:flex;align-items:center;gap:12px;background:var(--brand-deep);color:#FFFFFF;border:0;border-radius:22px;padding:16px 18px;text-align:left;width:100%}
.next small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em}
.next b{display:block;font-family:var(--display);font-weight:800;font-size:21px;margin-top:2px}
.next .go{width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;flex:none;color:var(--brand-deep)}
.next .go svg{width:20px;height:20px}
.vrow{display:flex;gap:8px}
.vbox{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.vbox span{font-size:11px;font-weight:800;color:var(--warn);letter-spacing:.08em}
.vbox.crit span{color:var(--accent)}
.vbox b{font-family:var(--display);font-size:20px}
.vbox small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ibtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px}
.ibtn svg{width:26px;height:26px;color:var(--accent)}
.ibtn b{font-size:13px;font-weight:700}
.ibtn .bd{position:absolute;top:8px;right:9px;background:var(--brand);color:#FFFFFF;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}
.ibtn .bd.w{background:var(--warn);color:#18181A}
.pills{display:flex;gap:8px}
.pill{flex:1;background:transparent;border:2px solid var(--brand);border-radius:999px;padding:12px;font-weight:800;font-size:14px;color:var(--accent);min-height:48px}
/* section heads */
.vh h2{margin:0;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.vh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.gt{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.gt::after{content:"";flex:1;height:1px;background:var(--line)}

/* count */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.cn{min-width:0}.cn b{display:block;font-weight:700}.cn small{font-size:12px;color:var(--muted)}
.fld{display:flex;flex-direction:column;align-items:center;gap:3px}
.fld label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input{width:66px;height:44px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);font-family:var(--mono);font-size:17px}
.ctot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);min-height:18px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.jh>div{min-width:0}
.tag.crit{background:var(--brand);color:#FFFFFF}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.tier{background:var(--dark);color:#FFFFFF}
.tag.tier2{background:var(--line);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:800;background:var(--brand);color:#FFFFFF;min-height:48px}
.btn.sec{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.grow{flex:1}

/* jobs */
.job{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex}
.job .rank{width:44px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-family:var(--mono);font-weight:600;font-size:15px;color:#FFFFFF;background:var(--warn)}
.job.crit .rank{background:var(--brand)}
.job.is-done .rank{background:var(--ok)}
.jb{flex:1;min-width:0;padding:14px 14px 14px 14px;display:flex;flex-direction:column;gap:10px}
.jh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.jh h3{margin:0;font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.need{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.dep{font-size:12.5px;background:var(--pink);color:var(--ink);padding:7px 10px;border-radius:8px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 16px;margin:0;padding:10px 0 0;list-style:none;border-top:1px dashed var(--line)}
.ing li{display:contents}
.ing span:last-child{font-family:var(--mono);text-align:right;font-weight:600}
.tick{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.tick svg{width:22px;height:22px;opacity:.18}
.job.is-done .tick{background:var(--ok);border-color:var(--ok)}
.job.is-done .tick svg{opacity:1;color:#FFFFFF}
.job.is-done h3,.job.is-done .ing,.job.is-done .need{opacity:.5}
.done{font-size:12.5px;color:var(--ok);font-weight:700}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* recipes / produce */
.rec{border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px;text-align:left}
.rec>button b{font-weight:700}
.chev{width:18px;height:18px;transition:transform .15s;color:var(--muted)}
.rec.open .chev{transform:rotate(90deg)}
.rb{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.calc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 12px}
.calc label{font-size:12px;font-weight:700}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:40px;height:40px;border:0;background:none;font-size:20px;font-weight:700}
.step input{width:58px;height:40px;border:0;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);text-align:center;font-family:var(--mono);font-size:16px;background:var(--input);color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
.search{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.edit-line{display:grid;grid-template-columns:minmax(0,1fr) 72px 60px 32px;gap:6px}
.edit-line input,.mrow input{min-width:0;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);padding:0 8px;font:inherit;font-size:14px}
.edit-line input.n,.mrow input{font-family:var(--mono);text-align:center}
.x{border:0;background:none;color:var(--muted);font-size:20px}
.link{background:none;border:0;color:var(--accent);font-weight:800;padding:4px 0;text-align:left}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 80px;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#FFFFFF;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:9;max-width:90vw}
/* method */
.how{border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.how summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:14px;color:var(--accent);list-style:none;display:flex;justify-content:space-between}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";font-size:18px;line-height:1}
.how[open] summary::after{content:"−"}
.how ol{margin:0;padding:0 16px 14px 34px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.45}
/* orders */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:78px}
.sbtn b{font-size:15px;font-weight:800}
.sbtn small{font-size:12px;color:var(--muted)}
.sbtn.has{border-color:var(--brand)}
.sbtn.has small{color:var(--accent);font-weight:700}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.irow.on b{color:var(--accent)}
.useg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.useg button{border:0;background:var(--surface);width:38px;height:38px;font-size:11.5px;font-weight:800;text-transform:uppercase}
.useg button[aria-pressed="true"]{background:var(--dark);color:#FFFFFF}
.useg button[data-u="cx"][aria-pressed="true"]{background:var(--brand)}
.useg button[data-u="kg"][aria-pressed="true"]{background:var(--ok)}
.unit{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;height:40px;min-width:58px;font-size:12px;font-weight:800;text-transform:uppercase}
.irow .step input{width:46px}
.irow .step button{width:34px}
pre.otext{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--bg);border-radius:10px;padding:12px;overflow-wrap:anywhere}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 14px 0}
.ohead h3{margin:0;font-size:18px;font-weight:800}
.obody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.orow{display:flex;gap:8px;flex-wrap:wrap}
.clearall{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent);border-color:var(--brand)}
.btn.armed{background:var(--brand);color:#FFFFFF;border-color:var(--brand)}
.t-orders{background:var(--surface);color:var(--ink);border:1.5px solid var(--dark)}
.t-serv{background:var(--surface);color:var(--ink);border:1.5px solid var(--brand);flex-direction:row;align-items:center;min-height:auto}
.t-serv small{margin-left:auto;text-align:right;max-width:55%}
.svc{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 55%;border-radius:14px;background:var(--bg);border:0;padding:0;cursor:zoom-in}
.svc .ph img{width:100%;height:100%;object-fit:cover;object-position:inherit;border-radius:14px;display:block}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}
.svc .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.svc h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.svc .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.svc .meta div{background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13px}
.svc .meta small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.svc ol{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.sugg{border-color:var(--brand)}
.t-val{background:var(--surface);color:var(--ink);border:1.5px solid var(--warn)}
.vcard{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.vcard:last-child{border-bottom:0}
.vcard .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vcard h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.lot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.lot b{font-size:14px;font-weight:700}
.lot small{grid-column:1;font-size:12px;color:var(--muted)}
.lot .clock{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--mono);font-weight:600;font-size:20px;line-height:1.1}
.lot .clock small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lot.ok .clock{color:var(--ok)}.lot.warn .clock{color:var(--warn)}.lot.crit .clock{color:var(--accent)}
.lot .life{grid-column:1/-1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.lot .life i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.lot.warn .life i{background:var(--warn)}.lot.crit .life i{background:var(--brand)}
.minsug{display:flex;flex-direction:column;gap:8px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.minsug .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sgrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sgrow:last-child{border-bottom:0}
.sgrow b{font-weight:700;font-size:14px}
.sgrow small{grid-column:1;font-size:12px;color:var(--muted)}
.sgrow .num{grid-row:1/3;grid-column:2;align-self:center;font-weight:600;color:var(--accent)}
.btn.wa{background:#0E7A3E;color:#FFFFFF;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.wa svg{width:18px;height:18px}
/* welcome */

function dayKey(d){try{return new Date(d).toLocaleDateString("sv-SE",{timeZone:"Europe/Lisbon"})}catch(e){return new Date(d).toISOString().slice(0,10)}}
const kDate=k=>new Date(k+"T12:00:00Z");
const addDays=(k,n)=>{const d=kDate(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const weekStart=k=>addDays(k,-((kDate(k).getUTCDay()+6)%7));
const DOW=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const dm=k=>k.slice(8,10)+"/"+k.slice(5,7);
const qTxt=(u,q)=>u==="L"?`${fmt(q)} L`:u==="kg"?`${fmt(q,2)} kg`:`${fmt(q,1)} ${u||""}`.trim();
function roundMin(p,x){
  if(isL(p))return Math.round(Math.max(BOTTLE,Math.ceil(x/BOTTLE-1e-9)*BOTTLE)*100)/100;
  if(p.unit==="kg")return Math.max(0.1,Math.ceil(x*10-1e-9)/10);
  return Math.max(1,Math.ceil(x-1e-9));
}
function vWeek(){
  if(!S.admin)return backBtn()+`<div class="empty"><b>Só para o gerente</b>O relatório semanal é visível para quem gere a app.</div>`;
  if(!S.logReady)return backBtn()+`<div class="empty"><b>A carregar…</b></div>`;
  const today=dayKey(Date.now()), ws=addDays(weekStart(today),7*S.wk), we=addDays(ws,6);
  const first=S.log.reduce((m,l)=>!l.demo&&l.day&&l.day<m?l.day:m,"9999-12-31");
  const from=first>ws?first:ws, to=today<we?today:we;
  const span=first<="9999"&&from<=to?Math.round((kDate(to)-kDate(from))/864e5)+1:0;
  const days=[...Array(7)].map((_,i)=>addDays(ws,i)).filter(d=>d<=today);
  const byDay={}, tot={};
  S.log.filter(l=>!l.demo&&l.day>=ws&&l.day<=we).forEach(l=>(l.items||[]).forEach(it=>{
    const q=+it.q||0;if(!q)return;
    const pk=(it.party?"f:":"")+it.id;
    const m=byDay[l.day]||(byDay[l.day]={});const x=m[pk]||(m[pk]={name:it.name,u:it.unit,q:0,party:!!it.party});x.q+=q;
    if(it.party)return;
    const t=tot[it.id]||(tot[it.id]={q:0,days:new Set(),n:0});t.q+=q;t.days.add(l.day);t.n++;}));
  const nav=`<div class="wnav"><button data-wk="-1" aria-label="Semana anterior">‹</button><b>${dm(ws)} – ${dm(we)}${S.wk===0?" · esta semana":""}</b><button data-wk="1" aria-label="Semana seguinte" ${S.wk>=0?"disabled":""}>›</button></div>`;
  if(we<first||!S.log.some(l=>!l.demo))return backBtn()+nav+`<div class="empty"><b>Ainda sem registos nesta semana</b>Cada vez que alguém carrega em Finalizar preps, o que foi feito fica registado aqui, por dia.</div>`;
  const litres=Object.values(byDay).flatMap(m=>Object.values(m)).filter(x=>x.u==="L").reduce((a,x)=>a+x.q,0);
  const nPreps=Object.values(byDay).reduce((a,m)=>a+Object.keys(m).length,0);
  const dayRows=days.slice().reverse().map(d=>{const m=byDay[d]||{},xs=Object.values(m).sort((a,b)=>b.q-a.q);
    const L=xs.filter(x=>x.u==="L").reduce((a,x)=>a+x.q,0), di=(kDate(d).getUTCDay()+6)%7;
    return `<div class="day ${xs.length?"":"zero"}"><div class="dh"><b>${DOW[di]} ${dm(d)}${d===today?" · hoje":""}</b><span>${xs.length?`${xs.length} prep${xs.length>1?"s":""}${L?` · ${fmt(L)} L`:""}`:d<first?"sem registo":"sem preps"}</span></div>
      ${xs.length?`<div class="chips">${xs.map(x=>`<span class="chip" ${x.party?'style="background:var(--pink)"':""}>${x.party?"🎉 ":""}${esc(x.name.replace(/^Batch\s+/i,""))}<span class="num">${qTxt(x.u,x.q)}</span></span>`).join("")}</div>`:""}</div>`}).join("");
  /* suggestions: production over the period ≈ consumption; suggested min = daily average × days of cover */
  const rows=countable().map(p=>{const t=tot[p.id], q=t?t.q:0, per=span?q/span:0, min=p.min||0;
    const sug=per>0?roundMin(p,per*S.cover):null, cov=per>0?min/per:Infinity;
    let k,txt;
    if(!q){k="none";txt=`Não precisou de prep${span<7?" nos dias registados":" esta semana"}: o stock nunca desceu abaixo do mínimo. Se a validade for curta, o mínimo pode estar alto.`}

    else if(min<sug*0.75){k="up";txt=`O mínimo só cobre ≈ ${fmt(cov,1)} dia${Math.round(cov*10)===10?"":"s"} e obriga a produzir muitas vezes. Sugestão: subir para ${qTxt(p.unit,sug)}${isL(p)?` (${fmt(sug/BOTTLE,1)} garrafas)`:""}.`}
    else{k="ok";txt=`O mínimo cobre ≈ ${fmt(cov,1)} dia${Math.round(cov*10)===10?"":"s"} de consumo — justifica-se.`}
    return{p,q,per,min,sug,cov,k,txt,nd:t?t.days.size:0}});
  const ord={down:0,up:1,none:2,ok:3};
  rows.sort((a,b)=>ord[a.k]-ord[b.k]||(b.cov===Infinity?0:b.cov)-(a.cov===Infinity?0:a.cov)||a.p.name.localeCompare(b.p.name));
  const TAG={down:'<span class="tag down">Baixar</span>',up:'<span class="tag up">Subir</span>',none:'<span class="tag tier2">Sem produção</span>',ok:'<span class="tag ok">Ajustado</span>'};
  const act=rows.filter(r=>r.k==="down"||r.k==="up").length;
  const sgRows=rows.filter(r=>r.k!=="none").map(r=>`<div class="sg"><div class="sh"><b>${esc(r.p.name)}</b>${TAG[r.k]}</div>
    <div class="nums"><div><small>Feito</small><span>${qTxt(r.p.unit,r.q)}</span></div><div><small>Mín. atual</small><span>${qTxt(r.p.unit,r.min)}</span></div><div><small>Sugerido</small><span>${r.sug!=null?qTxt(r.p.unit,r.sug):"—"}</span></div></div>
    <p>${esc(r.txt)} <span class="muted">Produzido em ${r.nd} dia${r.nd>1?"s":""}.</span></p></div>`).join("");
  const none=rows.filter(r=>r.k==="none");
  return backBtn()+nav+`

    <div class="stat"><b>${fmt(litres,1)}</b><span>Litros</span></div>
    <div class="stat ${act?"crit":""}"><b>${act}</b><span>A ajustar</span></div>
  </div>
  ${span<5?`<p class="note" style="margin:0">Só ${span} dia${span===1?"":"s"} de registo nesta semana — as sugestões ficam fiáveis com a semana completa.</p>`:""}
  <div class="gt">Por dia</div><div class="card">${dayRows}</div>
  <div class="gt">Stock mínimo</div>
  <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span style="flex:1;min-width:160px;font-size:13px">O mínimo deve aguentar quantos dias de consumo?</span>
    <div class="seg">${[2,3,4].map(n=>`<button data-cover="${n}" aria-pressed="${S.cover===n}">${n}</button>`).join("")}</div>
  </div>
  ${sgRows?`<div class="card">${sgRows}</div>`:""}
  ${none.length?`<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px"><b>Sem produção ${span<7?"nos dias registados":"esta semana"}</b>
    <p class="note" style="margin:0">Nunca desceram abaixo do mínimo. Pode ser consumo baixo ou mínimo alto — vale rever os de validade curta.</p>
    <div class="chips">${none.map(r=>`<span class="chip">${esc(r.p.name.replace(/^Batch\s+/i,""))}<span class="num">mín. ${qTxt(r.p.unit,r.min)}</span></span>`).join("")}</div></div>`:""}
  <p class="note">Preps de festa (🎉) aparecem nos dias mas não contam para as sugestões de mínimo. Consumo estimado = quantidade produzida ÷ dias registados. Sugerido = consumo por dia × ${S.cover} dias, arredondado a garrafas de 700 ml. Os mínimos alteram-se no chat com o Claude.</p>`;
}

/* ---------- validade: lotes em stock (FIFO), cronómetro e mínimos ---------- */
function lotsFor(p){
  if(!p.days)return{lots:[],raw:[]};
  const real=(S.log||[]).some(l=>!l.demo);
  const raw=[];for(const l of S.log||[]){if(!l.at||l.party||(l.demo&&real))continue;for(const it of (l.items||[]))if(it.id===p.id&&!it.party&&(+it.q)>0)raw.push({at:l.at,q:+it.q,demo:!!l.demo})}
  raw.sort((a,b)=>b.at.localeCompare(a.at));
  /* what is in stock = last count + what was made after it; the newest lots fill it first, the rest was used */
  const st=baseStatus(p), lastAt=S.latest?.at||"";
  let left=st.counted?st.have+raw.filter(r=>r.at>lastAt).reduce((a,r)=>a+r.q,0):Infinity;
  const now=Date.now(),lots=[];
  const mk=(r,q)=>{const t=new Date(r.at).getTime(),exp=t+p.days*864e5;return{at:r.at,q:r.q,inStock:q,exp,left:(exp-now)/864e5,age:(now-t)/864e5,demo:r.demo}};
  for(const r of raw){if(r.demo)continue;if(left<=1e-6||lots.length>=8)break;const q=Math.min(r.q,left);left-=q;lots.push(mk(r,q))}
  /* example lots (demo) only while nothing real has been finalized yet — never mixed with real stock */
  if(!(S.log||[]).some(l=>!l.demo))for(const r of raw)if(r.demo)lots.push(mk(r,r.q));
  lots.sort((a,b)=>b.at.localeCompare(a.at));
  return{lots,raw,counted:st.counted};
}
function minSuggestion(p,info){
  if(!p.min||!info.lots.length||!S.latest)return null;
  const old=info.lots[info.lots.length-1];if(old.age<p.days*0.6)return null;
  const now=Date.now(),win=14,recent=info.raw.filter(r=>(now-new Date(r.at))/864e5<=win);
  const first=info.raw.length?Math.min(...info.raw.map(r=>new Date(r.at).getTime())):now;
  const span=Math.max(1,Math.min(win,(now-first)/864e5));
  const per=recent.reduce((a,r)=>a+r.q,0)/span;
  const cover=Math.min(3,p.days*0.4);
  const sug=per>0?roundMin(p,per*cover):roundMin(p,0);
  return sug<p.min-1e-6?{sug,per,age:old.age,cover}:null;
}

async function saveCount(){

      S.area=null;S.pomar={};S.pomarText="";S.view=S.pomarItems.length?"pomar":"list";toast("Stock + bar somados · lista de preps gerada");
    }else{

      try{const again=(await S.db.doc("counting/current").get()).data()||{};const oo=again[otherArea(a)];

  const items=(S.myFaltas?.items||[]).filter(i=>i.status!=="pedido"||Date.now()-new Date(i.at)<7*864e5).slice(-150);
  lines.forEach((t,i)=>items.push({id:"f"+Date.now().toString(36)+i,text:t.slice(0,200),at:now,status:"falta"}));
  try{await S.db.doc("faltas/"+S.uid).set({items});el.value="";toast(lines.length>1?`${lines.length} faltas enviadas`:"Falta enviada")}
  catch(e){toast("Não foi possível enviar. Tente outra vez.")}
  fBusy=false;render(true);
}
async function editFalta(uid,id,op){
  if(!S.db||fBusy)return;const doc=S.faltas.find(f=>f.uid===uid);if(!doc)return;fBusy=true;
  let items=doc.items.map(i=>({...i}));
  if(op==="del")items=items.filter(i=>i.id!==id);else items=items.map(i=>i.id===id?{...i,status:i.status==="pedido"?"falta":"pedido"}:i);
  try{await S.db.doc("faltas/"+uid).set({items})}catch(e){toast("Não foi possível atualizar.")}
  fBusy=false;
}
async function saveRecipe(id){
  const lines=S.edBuf.filter(l=>(l.n||"").trim()).map(l=>{const o={n:l.n.trim(),q:l.q??null,u:(l.u||"").trim()};if(l.p)o.p=l.p;if(l.s)o.s=l.s;return o});
  const all=JSON.parse(JSON.stringify(S.recipes));all[id]=lines;
  try{await S.db.doc("config/recipes").set({r:all,m:S.methods||{},...(S.subs?{subs:S.subs}:{})});S.editing=null;toast("Receita guardada");render(true)}
  catch(e){toast("Só o dono pode alterar receitas")}
}
async function saveMins(){
  const items=S.preps.map(p=>{if(p.party)return p;const m=parse(document.getElementById("m-"+p.id)?.value),y=parse(document.getElementById("y-"+p.id)?.value);return{...p,min:m??p.min,yield:(y&&y>0)?y:p.yield}});
  try{await S.db.doc("config/preps").set({items});toast("Mínimos guardados")}
  catch(e){toast("Só o dono pode alterar os mínimos")}
}

const APP_URL=location.origin+location.pathname;
document.addEventListener("click",e=>{
  if(e.target.closest('[data-act="reload"]'))location.reload();
  const c=e.target.closest('[data-act="copylink"]');
  if(c){const ok=()=>{c.textContent="Link copiado ✓"};
    try{navigator.clipboard.writeText(APP_URL).then(ok,()=>{c.textContent=APP_URL})}catch(err){c.textContent=APP_URL}}
});

/* ---------- boot ---------- */
render(true);
(async()=>{
  if(!window.claude?.use){welcome(false);return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db;S.user=user;
  if(user){S.owner=await user.isOwner();S.admin=S.owner||await user.canEdit();S.uid=await user.id();S.write=null}
  if(!db){welcome(false);return}
  
  db.doc("config/preps").onSnapshot(s=>{const d=s.data();S.preps=s.exists&&d?.items?.length?d.items:null;render()},()=>{});
  db.doc("config/recipes").onSnapshot(s=>{S.recipes=(s.exists&&s.data()?.r)||{};S.methods=(s.exists&&s.data()?.m)||{};S.subs=(s.exists&&s.data()?.subs)||null;render()},()=>{});
  if(user)S.me=await user.me();
  db.doc("config/suppliers").onSnapshot(s=>{const d=(s.exists&&s.data())||{};S.sup=d.suppliers||[];S.pomarItems=d.pomar||[];S.pomarContact=d.pomarContact||null;render()},()=>{});
  db.collection("orders").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data()||{});S.orders=o;render()},()=>{});
  db.doc("config/party").onSnapshot(s=>{S.pcfg=(s.exists&&s.data()?.stock)||[];render()},()=>{});
  db.doc("counting/current").onSnapshot(s=>{S.cur=(s.exists&&s.data())||null;render()},()=>{});
  db.doc("party/next").onSnapshot(s=>{S.party=(s.exists&&s.data())||null;render()},()=>{});
  if(S.uid)db.doc("faltas/"+S.uid).onSnapshot(s=>{S.myFaltas=(s.exists&&s.data())||null;if(!S.admin)render()},()=>{});
  db.collection("prodlog").orderBy("at","desc").limit(S.admin?600:150).onSnapshot(s=>{S.log=s.docs.map(d=>({id:d.id,...d.data()}));S.logReady=true;if(S.view==="week"||S.view==="home"||S.view==="validity")render()},()=>{S.logReady=true;render()});
  db.doc("config/checklists").onSnapshot(s=>{S.ckcfg=(s.exists&&s.data()?.lists)||null;render()},()=>{});
  db.collection("checks").orderBy("day","desc").limit(40).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data()||{});S.cks=o;if(S.view==="check"||S.view==="home")render()},()=>{});
  db.doc("config/service").onSnapshot(s=>{S.service=(s.exists&&s.data()?.items)||[];if(S.view==="service")render()},()=>{});
  db.doc("config/ingmap").onSnapshot(s=>{S.ingmap=(s.exists&&s.data()?.map)||{};render()},()=>{});
  db.doc("config/inventario").onSnapshot(s=>{const d=s.exists&&s.data();S.inv=d?.items?.length?d.items:null;S.invReady=true;if(S.view==="inv")render()},()=>{S.invReady=true;if(S.view==="inv")render()});
  db.doc("inventario/current").onSnapshot(s=>{S.icur=(s.exists&&s.data())||null;if(S.view==="inv"||S.view==="home")render()},()=>{});
  db.collection("invlog").orderBy("at","desc").limit(12).onSnapshot(s=>{S.invlog=s.docs.map(d=>({id:d.id,...d.data()}));if(S.view==="inv"||S.view==="home")render()},()=>{});
  if(S.admin)db.collection("faltas").onSnapshot(s=>{S.faltas=s.docs.map(d=>({uid:d.id,items:(d.data()?.items)||[]}));render()},()=>{});
  db.collection("counts").orderBy("at","desc").limit(1).onSnapshot(s=>{
    const d=s.docs[0];S.latest=d?{id:d.id,...d.data()}:null;S.latestReady=true;
    if(S.unsubProd){S.unsubProd();S.unsubProd=null}S.prod={};
    if(S.latest)S.unsubProd=db.collection("production").doc(S.latest.id).onSnapshot(p=>{S.prod=(p.exists&&p.data())||{};render()},()=>{});
    render();
  },()=>{});
  render(true);
})();
})();
